<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0b16" />
<title>Nod the Beat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2300f2ea'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='26'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>
<main id="app">
  <section id="phone" class="phone">
    <video id="cam" class="cam" autoplay muted playsinline></video>
    <div class="band"></div>
    <canvas id="scene" class="scene"></canvas>

    <div id="hud" class="hud hidden">
      <div class="hud-top">
        <div class="score"><b id="score">0</b><span>hype</span></div>
        <div class="combo"><b id="combo">0</b><span>combo</span></div>
        <div class="time"><b id="time">15</b><span>sec</span></div>
      </div>
      <div id="judge" class="judge"></div>
      <div class="eyes"><span id="eyeL" class="eye">L</span><span id="eyeR" class="eye">R</span></div>
    </div>

    <div id="startPanel" class="panel">
      <div class="card gate">
        <svg viewBox="0 0 48 48" width="44" height="44" fill="none" stroke="#2a1740" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="30" height="24" rx="5"/><path d="M35 20l8-5v18l-8-5"/><circle cx="20" cy="24" r="6"/></svg>
        <h2>Allow the camera</h2>
        <p>Everything stays on your phone.</p>
        <button id="play" class="btn">Open camera</button>
        <button id="practice" class="link">No camera? Tap practice</button>
      </div>
    </div>

    <div id="setupPanel" class="panel hidden">
      <div class="card">
        <div class="kicker" id="setupKicker">CAMERA</div>
        <h2 id="setupTitle">Loading…</h2>
        <p id="setupText">One second.</p>
        <div id="calib" class="calib hidden"></div>
        <button id="startRound" class="btn hidden">Start</button>
        <button id="bothMode" class="link hidden">Use both eyes</button>
      </div>
    </div>

    <div id="howto" class="howto hidden" data-step="0">
      <svg class="gh" viewBox="0 0 240 200" width="240" height="200" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="arrows">
          <path class="al" d="M40 60 C 26 78, 26 104, 40 120 M30 110 l10 10 l12 -6"/>
          <path class="ar" d="M200 60 C 214 78, 214 104, 200 120 M210 110 l-10 10 l-12 -6"/>
          <path class="ad" d="M120 4 v26 M110 20 l10 10 l10 -10"/>
        </g>
        <path class="body" d="M38 198 C 70 160, 170 160, 202 198 M108 150 v16 M132 150 v16"/>
        <g class="head">
          <path d="M120 44 C 160 44, 178 72, 178 102 C 178 136, 150 152, 120 152 C 90 152, 62 136, 62 102 C 62 72, 80 44, 120 44 Z"/>
          <path d="M72 86 C 92 62, 148 62, 168 86"/>
          <path d="M60 100 C 60 52, 180 52, 180 100"/>
          <rect x="50" y="92" width="14" height="28" rx="6"/><rect x="176" y="92" width="14" height="28" rx="6"/>
          <circle cx="102" cy="104" r="4.5" fill="#fff" stroke="none"/><circle cx="138" cy="104" r="4.5" fill="#fff" stroke="none"/>
          <path d="M106 126 C 113 135, 127 135, 134 126"/>
        </g>
      </svg>
      <b>Shake head to drop the beat</b>
      <span id="howtoLbl">Tilt left</span>
      <em id="howtoCta"></em>
    </div>
    <div id="countdown" class="countdown hidden"></div>

    <div id="resultPanel" class="resultlite hidden">
      <div class="rhead">
        <b><span id="rPct">0%</span></b>
        <span id="rLine">swept off their feet</span>
        <em id="resultTitle">Irresistible.</em>
      </div>
      <div class="rbtns hidden" id="rbtns">
        <button id="replay" class="replay" aria-label="Play again"><svg viewBox="0 0 48 48" width="34" height="34" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M38 24a14 14 0 1 1-4.1-9.9"/><path d="M34 6v9h-9"/></svg></button>
        <button id="home" class="link">Back</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="./app.mjs?v=25"></script>
</body>
</html>
